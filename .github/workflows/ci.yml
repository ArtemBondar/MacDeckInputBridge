name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  receiver:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: receiver
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
