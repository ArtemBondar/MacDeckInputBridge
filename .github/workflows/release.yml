name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      replace_existing: ${{ steps.version.outputs.replace_existing }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            if [[ "$(tr -d '\n' < VERSION)" != "$version" ]]; then
              echo "Tag $tag does not match VERSION" >&2
              exit 1
            fi
            should_release=true
            replace_existing=false
          else
            version="$(tr -d '\n' < VERSION)"
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # The only mutable release path is the owner-approved correction
              # of v0.0.1. Requiring this exact merge commit title prevents a
              # routine future push from rewriting an existing release.
              if [[ "$version" == "0.0.1" && \
                "$(git log -1 --format=%s)" == "Release correction: v0.0.1" ]]; then
                should_release=true
                replace_existing=true
              else
                should_release=false
                replace_existing=false
              fi
            else
              should_release=true
              replace_existing=false
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "replace_existing=$replace_existing" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: MAC_DECK_APP_VERSION='${{ needs.prepare.outputs.version }}' sh scripts/build-macos-app.sh
      - run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent .build/MacDeckInputBridge.app \
            dist/MacDeckInputBridge-macos.zip
          shasum -a 256 dist/MacDeckInputBridge-macos.zip > dist/MacDeckInputBridge-macos.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/

  steamdeck:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: receiver
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features desktop-ui -- -D warnings
      - run: cargo test --locked --features desktop-ui
      - run: sh scripts/test-steamdeck-app-installation.sh
      - run: cargo build --release --locked --features desktop-ui --bins
      - name: Package Steam Deck archive
        working-directory: .
        run: |
          package=dist/mac-deck-input-bridge-steamdeck-x86_64
          mkdir -p "$package/receiver/target/release" "$package/receiver/scripts" \
            "$package/receiver/resources"
          install -m 755 receiver/target/release/mac-deck-receiver "$package/receiver/target/release/"
          install -m 755 receiver/target/release/mac-deck-receiver-ui "$package/receiver/target/release/"
          install -m 755 receiver/scripts/install-steamdeck-app.sh "$package/receiver/scripts/"
          install -m 755 receiver/scripts/uninstall-steamdeck-app.sh "$package/receiver/scripts/"
          install -m 644 receiver/resources/mac-deck-input-bridge.desktop "$package/receiver/resources/"
          install -m 644 receiver/resources/mac-deck-input-bridge.svg "$package/receiver/resources/"
          install -m 644 assets/MacDeckInputBridgeIcon.png \
            "$package/receiver/resources/mac-deck-input-bridge.png"
          install -m 644 docs/STEAMDECK_APP.md "$package/README.md"
          tar -C dist -czf dist/mac-deck-input-bridge-steamdeck-x86_64.tar.gz \
            mac-deck-input-bridge-steamdeck-x86_64
          shasum -a 256 dist/mac-deck-input-bridge-steamdeck-x86_64.tar.gz \
            > dist/mac-deck-input-bridge-steamdeck-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: steamdeck-release
          path: dist/

  publish:
    needs: [prepare, macos, steamdeck]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release from this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPLACE_EXISTING: ${{ needs.prepare.outputs.replace_existing }}
        run: |
          cat > notes.md <<EOF
          ## MacDeckInputBridge $VERSION

          - The macOS and Steam Deck apps must be from this same release.
          - macOS requires Accessibility permission after installation.
          - The macOS app is ad-hoc signed in this release; notarized distribution is planned for a later release.
          - Steam Deck installation and non-root \`/dev/uinput\` setup instructions are included in the archive.
          EOF
          if [[ "$REPLACE_EXISTING" == true ]]; then
            git push --force origin "$GITHUB_SHA:refs/tags/$TAG"
            gh release edit "$TAG" --target "$GITHUB_SHA" \
              --title "MacDeckInputBridge $TAG" --notes-file notes.md
            gh release upload "$TAG" --clobber \
              dist/*.zip dist/*.tar.gz dist/*.sha256
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MacDeckInputBridge $TAG" \
              --notes-file notes.md \
              dist/*.zip dist/*.tar.gz dist/*.sha256
          fi
