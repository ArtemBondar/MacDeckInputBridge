[package]
name = "mac-deck-receiver"
version = "0.0.1"
edition = "2021"
publish = false

[features]
default = []
desktop-ui = ["dep:eframe", "dep:evdev", "dep:get_if_addrs", "dep:image", "dep:serde", "dep:toml", "dep:ksni", "dep:zbus", "dep:winit", "dep:x11rb"]

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
evdev = { version = "0.13", optional = true }
get_if_addrs = { version = "0.5", optional = true }
hkdf = "0.12"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
libc = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"], optional = true }
sha2 = "0.10"
thiserror = "1.0"
toml = { version = "0.8", optional = true }
wl-clipboard-rs = "0.9.4"
ksni = { version = "0.3.7", features = ["blocking"], optional = true }
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "tokio"], optional = true }
winit = { version = "0.30", default-features = false, features = ["x11"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true }

[[bin]]
name = "mac-deck-receiver-ui"
path = "src/gui.rs"
required-features = ["desktop-ui"]

[dev-dependencies]
hex = "0.4"
