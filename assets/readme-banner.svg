<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">MacDeck: one keyboard, two devices</title><desc id="desc">Use your Mac keyboard with a docked Steam Deck.</desc>
<rect width="1200" height="300" rx="20" fill="#18221e"/>
<text x="60" y="95" fill="#edf3e9" font-family="Arial,sans-serif" font-weight="700" font-size="42">MacDeck</text>
<text x="60" y="155" fill="#edf3e9" font-family="Arial,sans-serif" font-weight="700" font-size="32">Dock your Deck. Keep your keyboard.</text>
<text x="60" y="205" fill="#adbdaf" font-family="Arial,sans-serif" font-size="21">One keyboard. Your Mac and Steam Deck.</text>
